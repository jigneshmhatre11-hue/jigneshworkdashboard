<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Work Dashboard</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><meta name="description" content="Personal Hybrid Work Tracker - My Work Dashboard"><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;--bg:#0b1020;--panel:#151d31;--panel2:#1d2940;--border:#30405a;--text:#f1f5fb;--muted:#9caec6;--accent:#6b8cff;--green:#43c99a;--red:#ff7187}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--border);background:var(--panel2);color:var(--text);padding:10px 13px;border-radius:10px}button:hover{filter:brightness(1.18)}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--red)}button.active{background:var(--accent);border-color:var(--accent)}button:disabled{opacity:.45;cursor:not-allowed}input,select,textarea{width:100%;background:#0d172a;color:var(--text);border:1px solid var(--border);border-radius:9px;padding:11px;min-width:0}textarea{min-height:85px;resize:vertical}label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.app{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.top h1{font-size:25px;margin:0}.muted{color:var(--muted)}.small{font-size:12px}.nav{display:flex;gap:8px;overflow-x:auto;padding:20px 0 14px}.nav button{white-space:nowrap}.panel{background:var(--panel);border:1px solid var(--border);border-radius:15px;padding:18px;margin:14px 0}.panel h2{margin:0 0 16px;font-size:21px}.panel h3{margin:4px 0 15px;font-size:16px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.between{justify-content:space-between}.grow{flex:1}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.stat{background:var(--panel2);padding:17px;border-radius:12px}.stat strong{display:block;font-size:27px;margin-top:9px}.item{border:1px solid var(--border);padding:15px;border-radius:12px;margin:10px 0}.item-title{font-weight:700;font-size:16px}.badge{display:inline-block;padding:4px 9px;border-radius:20px;background:#30405a;font-size:12px}.badge.Completed{background:#154f40;color:#8af4ce}.badge.Urgent{background:#642b3a;color:#ffc1cc}.badge.High{background:#59401f;color:#ffd18a}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{padding:7px 10px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.field.full{grid-column:1/-1}.bar{height:10px;background:#28334a;border-radius:10px;overflow:hidden}.bar>span{display:block;height:100%;background:var(--accent);border-radius:10px}.breakdown{margin:12px 0}.breakdown .row{margin-bottom:6px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.timer{font-variant-numeric:tabular-nums;font-size:52px;text-align:center;font-weight:750;letter-spacing:2px;margin:22px 0}.empty{text-align:center;color:var(--muted);padding:24px}.toast{position:fixed;bottom:20px;right:20px;background:#224a3c;color:#eafff5;border:1px solid #3b9c77;border-radius:10px;padding:13px 18px;display:none;z-index:5}.chart{display:flex;align-items:end;gap:10px;height:170px;padding:10px 0 0}.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:end;align-items:center;height:100%;gap:6px}.chart-bar{width:min(60px,85%);background:linear-gradient(#8aa2ff,#5476ec);border-radius:7px 7px 0 0;min-height:2px}.chart-label{font-size:11px;text-align:center;color:var(--muted);overflow-wrap:anywhere}.foot{padding:18px 0;color:var(--muted);font-size:12px}.hide{display:none!important}@media(max-width:720px){.app{padding:12px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two,.fields{grid-template-columns:1fr}.top h1{font-size:21px}.timer{font-size:40px}.panel{padding:14px}}

.cloud-auth{max-width:520px;margin:45px auto}.cloud-auth .fields{grid-template-columns:1fr}.cloud-status{font-size:12px;color:var(--muted)}.cloud-actions{display:flex;gap:8px;flex-wrap:wrap}.cloud-actions button{font-size:12px}.cloud-note{border-left:3px solid var(--accent);padding:10px 12px;background:var(--panel2);margin:12px 0}.cloud-error{color:var(--red);white-space:pre-wrap;overflow-wrap:anywhere}
</style></head><body><main class="app"><header class="top"><div><h1>My Work Dashboard</h1><div class="muted small">Personal Hybrid Work Tracker · Single-file Edition</div></div><span id="cloud-indicator" class="badge">Cloud setup required</span></header><nav class="nav" id="nav"></nav><section id="content"></section><footer class="foot">Cloud sync requires a Supabase account and internet. JSON backup is recommended before importing existing work.</footer></main><div id="toast" class="toast" role="status"></div><script>
'use strict';
const KEY='personal_work_dashboard_v2_single_file';
const TODAY=()=>{const parts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Kolkata',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date()).map(x=>[x.type,x.value]));return `${parts.year}-${parts.month}-${parts.day}`};
const initial=()=>({clients:[{id:1,name:'Client Alpha'},{id:2,name:'Client Beta'},{id:3,name:'Client Gamma'}],categories:[{id:1,name:'Ads',description:'Performance Marketing'},{id:2,name:'Reels',description:'Editing'},{id:3,name:'Website',description:'Vibe Coding / Web Development'}],tasks:[{id:1,name:'Instagram Reel Editing',clientId:1,categoryId:2,status:'Completed',priority:'High',minutes:85,date:TODAY(),remarks:'Reel edited and delivered for approval.'},{id:2,name:'Meta Lead Campaign Setup',clientId:2,categoryId:1,status:'In Progress',priority:'Urgent',minutes:40,date:TODAY(),remarks:'Audience and creatives configured.'},{id:3,name:'Landing Page Development',clientId:3,categoryId:3,status:'In Review',priority:'Medium',minutes:125,date:TODAY(),remarks:'Awaiting review.'}]});
let db;try{db=JSON.parse(localStorage.getItem(KEY))||initial()}catch{db=initial()}
const statuses=['To Do','In Progress','In Review','Revision Required','On Hold','Completed'],priorities=['Low','Medium','High','Urgent'];
let selectedWorkDate=TODAY();
let page='overview',period='weekly',search='',statusFilter='All',editId=null,editingType=null,editingId=null,activeTimerTask='',timer={taskId:null,startedAt:null,elapsed:0,running:false};
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>{if(!cloudUser){toast('Please sign in to save cloud data');return}queueCloudSave()};
const fmt=m=>`${Math.floor(m/60)}h ${Math.round(m%60)}m`,cn=id=>db.clients.find(x=>x.id===id)?.name||'Unassigned',cat=id=>db.categories.find(x=>x.id===id)?.name||'Uncategorised';
const nextId=a=>Math.max(0,...a.map(x=>x.id))+1;
function toast(s){const e=$('toast');e.textContent=s;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function taskText(t){return `📋 WORK TASK REPORT\n\nTask: ${t.name}\nClient: ${cn(t.clientId)}\nCategory: ${cat(t.categoryId)}\nDate: ${t.date}\nStatus: ${t.status}\nPriority: ${t.priority}\nTime Spent: ${fmt(t.minutes)}\nRemarks: ${t.remarks||'—'}`}
async function copyText(s){try{await navigator.clipboard.writeText(s);toast('Copied to clipboard!')}catch{const e=document.createElement('textarea');e.value=s;document.body.appendChild(e);e.select();try{document.execCommand('copy');toast('Copied to clipboard!')}catch{toast('Copy failed. Try HTTPS or localhost.')}e.remove()}}
function navigate(p){page=p;render()}
function render(){if(!cloudUser){renderCloudGate();return}const nav=[['overview','▦ Overview'],['today','▣ Today’s Work'],['tasks','☑ Tasks'],['timer','◷ Timer'],['reports','▥ Reports'],['clients','♙ Clients'],['categories','▤ Categories'],['backup','⇩ Backup']];$('cloud-indicator').textContent=cloudSaving?'☁ Syncing…':cloudError?'⚠ Sync error':'☁ Cloud connected';$('nav').innerHTML=nav.map(([id,l])=>`<button class="${page===id?'active':''}" onclick="navigate('${id}')">${l}</button>`).join('');$('content').innerHTML=page==='overview'||page==='reports'?reportView():page==='today'?todayWorkView():page==='tasks'?tasksView():page==='editor'?editorView():page==='timer'?timerView():page==='clients'?collectionView('client'):page==='categories'?collectionView('category'):backupView();if(page==='timer')refreshClock()}

function shiftWorkDay(delta){
  const d=new Date(selectedWorkDate+'T12:00:00');
  d.setDate(d.getDate()+delta);
  selectedWorkDate=[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');
  render();
}
function setWorkDay(value){if(/^\d{4}-\d{2}-\d{2}$/.test(value)){selectedWorkDate=value;render()}}
function todayWorkView(){
  const arr=db.tasks.filter(t=>t.date===selectedWorkDate).sort((a,b)=>a.id-b.id);
  const done=arr.filter(t=>t.status==='Completed').length;
  const minutes=arr.reduce((sum,t)=>sum+(Number(t.minutes)||0),0);
  const label=selectedWorkDate===TODAY()?'Today’s Work':'Work on '+new Date(selectedWorkDate+'T12:00:00').toLocaleDateString('en-IN',{day:'numeric',month:'long',year:'numeric'});
  return `<div class="panel"><div class="row between"><div><h2>${esc(label)}</h2><p class="muted small">All clients and categories together — select any day to see its work.</p></div><button class="primary" onclick="newTaskForDay()">+ Add Task</button></div>
  <div class="row" style="margin:16px 0;align-items:center;flex-wrap:wrap">
  <button onclick="shiftWorkDay(-1)" aria-label="Previous day">← Previous</button>
  <input type="date" aria-label="Select work date" value="${esc(selectedWorkDate)}" onchange="setWorkDay(this.value)" style="width:auto;max-width:190px">
  <button onclick="shiftWorkDay(1)" aria-label="Next day">Next →</button>
  <button onclick="selectedWorkDate=TODAY();render()">Today</button></div>
  <div class="grid">${[['Total Tasks',arr.length],['Completed',done],['Pending',arr.length-done],['Time Worked',fmt(minutes)]].map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}</div></div>
  <div class="panel"><div class="row between"><h3>Work Details · ${arr.length} task(s)</h3><button onclick="copyDayWork()">⧉ Copy Day Report</button></div>
  ${arr.length?arr.map(t=>`<article class="item">
    <div class="row between"><div class="grow"><div class="item-title">${esc(t.name)}</div><div class="muted small">${esc(cn(t.clientId))} · ${esc(cat(t.categoryId))}</div></div><span class="badge ${esc(t.priority)}">${esc(t.priority)}</span></div>
    <div class="row" style="margin:10px 0;gap:12px;flex-wrap:wrap"><span class="muted small">⏱ ${fmt(Number(t.minutes)||0)}</span><span class="muted small">Priority: ${esc(t.priority)}</span></div>
    <p class="muted small" style="white-space:pre-wrap">${esc(t.remarks||'No work notes')}</p>
    <div class="row" style="flex-wrap:wrap;gap:8px"><select aria-label="Status for ${esc(t.name)}" onchange="changeTodayStatus(${t.id},this.value)" style="width:auto;max-width:200px">${statuses.map(v=>`<option ${t.status===v?'selected':''}>${esc(v)}</option>`).join('')}</select><button onclick="copyTask(${t.id})">⧉ Copy</button><button onclick="openTask(${t.id})">Edit</button></div>
  </article>`).join(''):'<div class="empty">No work recorded for this date. Choose another day or add a task.</div>'}</div>`;
}
function newTaskForDay(){editId=null;navigate('editor');const dateInput=document.querySelector('#task-form [name="date"]');if(dateInput)dateInput.value=selectedWorkDate}
function changeTodayStatus(id,value){const t=db.tasks.find(x=>x.id===id);if(t&&statuses.includes(value)){t.status=value;save();render();toast('Status updated')}}
function copyDayWork(){const arr=db.tasks.filter(t=>t.date===selectedWorkDate);copyText('WORK REPORT — '+selectedWorkDate+'\nTotal: '+arr.length+' | Completed: '+arr.filter(t=>t.status==='Completed').length+' | Time: '+fmt(arr.reduce((s,t)=>s+(Number(t.minutes)||0),0))+'\n\n'+(arr.map(taskText).join('\n\n----------------\n\n')||'No tasks recorded'))}

function reportItems(){const now=new Date(TODAY()+'T12:00:00');const monday=new Date(now);monday.setDate(now.getDate()-(now.getDay()+6)%7);const first=new Date(now.getFullYear(),now.getMonth(),1);return db.tasks.filter(t=>{const d=new Date(t.date+'T12:00:00');return period==='daily'?t.date===TODAY():period==='weekly'?d>=monday&&d<=now:d>=first&&d<=now})}
function barRows(items,type){const total=items.reduce((s,x)=>s+x.value,0);return items.map(x=>`<div class="breakdown"><div class="row between"><span>${esc(x.label)}</span><b>${type==='time'?fmt(x.value):x.value}</b></div><div class="bar"><span style="width:${total?x.value/total*100:0}%"></span></div></div>`).join('')||'<p class="muted">No data</p>'}
function reportView(){const arr=reportItems(),done=arr.filter(x=>x.status==='Completed').length,total=arr.reduce((s,t)=>s+t.minutes,0),cats=db.categories.map(c=>({label:c.name,value:arr.filter(t=>t.categoryId===c.id).reduce((s,t)=>s+t.minutes,0)})),clients=db.clients.map(c=>({label:c.name,value:arr.filter(t=>t.clientId===c.id).reduce((s,t)=>s+t.minutes,0)})),stat=statuses.map(s=>({label:s,value:arr.filter(t=>t.status===s).length}));let html=`<div class="panel"><div class="row between"><h2>${page==='overview'?'Work Overview':'Reports & Analytics'}</h2><button class="primary" onclick="newTask()">+ Add Task</button></div><div class="tabs">${[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly']].map(([k,l])=>`<button class="${period===k?'active':''}" onclick="period='${k}';render()">${l}</button>`).join('')}</div><div class="grid" style="margin-top:15px">${[['Total Tasks',arr.length],['Completed',done],['Pending / Open',arr.length-done],['Time Worked',fmt(total)]].map(([k,v])=>`<div class="stat"><span class="muted">${k}</span><strong>${v}</strong></div>`).join('')}</div><div class="breakdown"><div class="row between"><b>Completion Rate</b><b>${arr.length?Math.round(done/arr.length*100):0}%</b></div><div class="bar"><span style="width:${arr.length?done/arr.length*100:0}%;background:var(--green)"></span></div></div></div><div class="two"><div class="panel"><h3>Category-wise Hours</h3>${barRows(cats,'time')}</div><div class="panel"><h3>Client-wise Hours</h3>${barRows(clients,'time')}</div></div><div class="two"><div class="panel"><h3>Category Time Chart</h3>${chart(cats)}</div><div class="panel"><h3>Task Status Breakdown</h3>${barRows(stat,'count')}</div></div>`;if(page==='overview')html+=`<div class="panel"><div class="row between"><h3>Recent Tasks</h3><button onclick="navigate('tasks')">View All</button></div>${db.tasks.slice().sort((a,b)=>b.id-a.id).slice(0,5).map(t=>`<div class="item"><div class="row between"><div><b>${esc(t.name)}</b><div class="muted small">${esc(cn(t.clientId))} · ${esc(t.status)}</div></div><button onclick="copyTask(${t.id})">⧉ Copy</button></div></div>`).join('')||'<div class="empty">No tasks yet</div>'}</div>`;return html}
function chart(items){const max=Math.max(1,...items.map(x=>x.value));return `<div class="chart">${items.map(x=>`<div class="chart-col"><b class="small">${(x.value/60).toFixed(1)}h</b><div class="chart-bar" style="height:${Math.max(2,Math.round(x.value/max*110))}px"></div><span class="chart-label">${esc(x.label)}</span></div>`).join('')}</div>`}
function tasksView(){const list=db.tasks.filter(t=>(statusFilter==='All'||t.status===statusFilter)&&[t.name,cn(t.clientId),cat(t.categoryId)].some(s=>s.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);return `<div class="panel"><div class="row between"><h2>All Tasks</h2><button class="primary" onclick="newTask()">+ Add Task</button></div><div class="two"><input placeholder="Search task, client or category" value="${esc(search)}" oninput="search=this.value;updateTaskList()"><select onchange="statusFilter=this.value;updateTaskList()">${['All',...statuses].map(s=>`<option ${statusFilter===s?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div id="task-list">${taskListHTML(list)}</div></div>`}
function taskListHTML(list){return `<p class="muted small">${list.length} task(s)</p>${list.map(t=>`<article class="item"><div class="row between"><div class="grow"><div class="item-title">${esc(t.name)}</div><div class="muted small">${esc(cn(t.clientId))} · ${esc(cat(t.categoryId))}</div></div><span class="badge ${esc(t.priority)}">${esc(t.priority)}</span></div><div class="row between" style="margin-top:12px"><span class="muted small">${esc(t.date)} · ${fmt(t.minutes)}</span><div class="actions"><button onclick="copyTask(${t.id})">⧉ Copy</button><button onclick="openTask(${t.id})">Edit</button><button class="danger" onclick="deleteTask(${t.id})">Delete</button></div></div><div style="margin-top:12px"><select aria-label="Task status" onchange="changeStatus(${t.id},this.value)">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${esc(s)}</option>`).join('')}</select></div></article>`).join('')||'<div class="empty">No matching tasks</div>'}`}
function updateTaskList(){const el=$('task-list');if(!el)return;const list=db.tasks.filter(t=>(statusFilter==='All'||t.status===statusFilter)&&[t.name,cn(t.clientId),cat(t.categoryId)].some(s=>s.toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);el.innerHTML=taskListHTML(list)}
function changeStatus(id,v){const t=db.tasks.find(t=>t.id===id);if(t){t.status=v;save();updateTaskList()}}
function newTask(){editId=null;navigate('editor')}function openTask(id){editId=id;navigate('editor')}
function editorView(){const t=db.tasks.find(x=>x.id===editId)||{name:'',clientId:db.clients[0]?.id||'',categoryId:db.categories[0]?.id||'',status:'To Do',priority:'Medium',date:TODAY(),minutes:0,remarks:''};return `<div class="panel"><div class="row between"><h2>${editId===null?'Create Task':'Edit Task'}</h2><button onclick="navigate('tasks')">← Tasks</button></div><form id="task-form" onsubmit="saveTask(event)"><div class="fields"><div class="field full"><label>Task Name</label><input name="name" value="${esc(t.name)}" required maxlength="160"></div><div class="field"><label>Client / Project</label><select name="clientId" onchange="$('inline-client').classList.toggle('hide',this.value!=='new')">${db.clients.map(c=>`<option value="${c.id}" ${t.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}<option value="new">+ Add New Client</option></select><div id="inline-client" class="hide" style="margin-top:8px"><input name="newClient" placeholder="New client name"></div></div><div class="field"><label>Category</label><select name="categoryId" required>${db.categories.map(c=>`<option value="${c.id}" ${t.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field"><label>Status</label><select name="status">${statuses.map(s=>`<option ${s===t.status?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Priority</label><select name="priority">${priorities.map(s=>`<option ${s===t.priority?'selected':''}>${esc(s)}</option>`).join('')}</select></div><div class="field"><label>Work Date</label><input name="date" type="date" value="${esc(t.date)}" required></div><div class="field"><label>Total Time Spent (minutes)</label><input name="minutes" type="number" min="0" step="1" value="${t.minutes}" required></div><div class="field full"><label>Remarks / Work Notes</label><textarea name="remarks">${esc(t.remarks)}</textarea></div></div><div class="row" style="margin-top:18px"><button type="submit" class="primary">Save Task</button><button type="button" onclick="navigate('tasks')">Cancel</button></div></form></div>`}
function saveTask(ev){ev.preventDefault();const f=new FormData(ev.target),name=String(f.get('name')||'').trim();if(!name)return;let cid=Number(f.get('clientId'));if(f.get('clientId')==='new'){const n=String(f.get('newClient')||'').trim();if(!n){toast('Enter new client name');return}cid=nextId(db.clients);db.clients.push({id:cid,name:n})}const old=db.tasks.find(t=>t.id===editId);const t={id:old?.id||nextId(db.tasks),name,clientId:cid,categoryId:Number(f.get('categoryId')),status:String(f.get('status')),priority:String(f.get('priority')),date:String(f.get('date')),minutes:Math.max(0,Math.floor(Number(f.get('minutes'))||0)),remarks:String(f.get('remarks')||'')};if(old)Object.assign(old,t);else db.tasks.push(t);save();toast('Task saved');navigate('tasks')}
function deleteTask(id){const t=db.tasks.find(t=>t.id===id);if(t&&confirm(`Delete task "${t.name}"?`)){db.tasks=db.tasks.filter(t=>t.id!==id);save();render()}}
function copyTask(id){const t=db.tasks.find(t=>t.id===id);if(t)copyText(taskText(t))}
function timerElapsed(){return timer.elapsed+(timer.running&&timer.startedAt?Math.max(0,Math.floor((Date.now()-timer.startedAt)/1000)):0)}
function timerView(){return `<div class="panel"><h2>Time Tracker</h2><p class="muted">Select a task, start the stopwatch, then save the elapsed time to that task.</p><label>Task</label><select id="timer-task" onchange="selectTimerTask(this.value)"><option value="">Select Task</option>${db.tasks.map(t=>`<option value="${t.id}" ${String(timer.taskId)===String(t.id)?'selected':''}>${esc(t.name)}</option>`).join('')}</select><div class="timer" id="clock">00:00:00</div><div class="row" style="justify-content:center"><button class="primary" onclick="startTimer()">▶ Start / Resume</button><button onclick="pauseTimer()">Ⅱ Pause</button><button onclick="saveTimer()">■ Stop & Save</button><button onclick="resetTimer()">↺ Reset</button></div><p class="muted small" style="text-align:center">The stopwatch runs while this page remains open. Switching dashboard tabs is supported. Closing or refreshing the page stops the unsaved timer.</p></div><div class="panel"><h3>Manual Time Entry</h3><div class="two"><div><label>Hours</label><input id="log-hours" type="number" min="0" value="0"></div><div><label>Minutes</label><input id="log-minutes" type="number" min="0" value="0"></div></div><button class="primary" style="margin-top:12px" onclick="logManual()">+ Add Time to Selected Task</button></div>`}
function selectTimerTask(v){if(timer.running||timerElapsed()>0){toast('Save or reset current timer before switching tasks');$('timer-task').value=timer.taskId||'';return}timer.taskId=v?Number(v):null;refreshClock()}
function startTimer(){if(!timer.taskId){toast('Select a task first');return}if(!timer.running){timer.startedAt=Date.now();timer.running=true;toast('Timer started')}}
function pauseTimer(){if(timer.running){timer.elapsed=timerElapsed();timer.startedAt=null;timer.running=false;refreshClock();toast('Timer paused')}}
function resetTimer(){if(timerElapsed()&&!confirm('Discard unsaved timer time?'))return;timer.elapsed=0;timer.startedAt=null;timer.running=false;refreshClock()}
function saveTimer(){if(!timer.taskId){toast('Select a task first');return}const seconds=timerElapsed(),minutes=Math.ceil(seconds/60);if(minutes<=0){toast('No time to save yet');return}const t=db.tasks.find(t=>t.id===timer.taskId);if(!t){toast('Task not found');return}t.minutes+=minutes;save();timer.elapsed=0;timer.startedAt=null;timer.running=false;refreshClock();toast(`Saved ${minutes} minute(s) to task`)}
function refreshClock(){const e=$('clock');if(!e)return;const s=timerElapsed();e.textContent=[Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}
setInterval(()=>{if(timer.running)refreshClock()},250);
function logManual(){const id=Number($('timer-task')?.value),t=db.tasks.find(t=>t.id===id);if(!t){toast('Select a task first');return}const h=Number($('log-hours').value),m=Number($('log-minutes').value);if(!Number.isFinite(h)||!Number.isFinite(m)||h<0||m<0||!Number.isInteger(h)||!Number.isInteger(m)||h*60+m<=0){toast('Enter valid hours and minutes');return}t.minutes+=h*60+m;save();$('log-hours').value='0';$('log-minutes').value='0';toast('Time added to task')}
function collectionView(type){const isClient=type==='client',list=isClient?db.clients:db.categories,title=isClient?'Clients / Projects':'Task Categories';return `<div class="panel"><div class="row between"><h2>${title}</h2><button class="primary" onclick="openCollection('${type}',null)">+ Add ${isClient?'Client':'Category'}</button></div>${list.map(x=>`<div class="item"><div class="row between"><div class="grow"><b>${esc(x.name)}</b>${!isClient?`<div class="muted small">${esc(x.description)}</div>`:''}<div class="muted small">${db.tasks.filter(t=>t[isClient?'clientId':'categoryId']===x.id).length} Tasks · ${fmt(db.tasks.filter(t=>t[isClient?'clientId':'categoryId']===x.id).reduce((s,t)=>s+t.minutes,0))}</div></div><div class="actions"><button onclick="openCollection('${type}',${x.id})">Edit</button><button class="danger" onclick="deleteCollection('${type}',${x.id})">Delete</button></div></div></div>`).join('')||'<div class="empty">No entries</div>'}<div id="collection-form"></div></div>`}
function openCollection(type,id){const x=(type==='client'?db.clients:db.categories).find(x=>x.id===id);$('collection-form').innerHTML=`<div class="item"><h3>${id===null?'Add':'Edit'} ${type}</h3><form onsubmit="saveCollection(event,'${type}',${id===null?'null':id})"><label>Name</label><input name="name" required value="${esc(x?.name||'')}">${type==='category'?`<label style="margin-top:10px">Description</label><input name="description" value="${esc(x?.description||'')}">`:''}<div class="row" style="margin-top:12px"><button class="primary" type="submit">Save</button><button type="button" onclick="$('collection-form').innerHTML=''">Cancel</button></div></form></div>`}
function saveCollection(e,type,id){e.preventDefault();const arr=type==='client'?db.clients:db.categories,f=new FormData(e.target),name=String(f.get('name')||'').trim();if(!name)return;if(arr.some(x=>x.id!==id&&x.name.toLowerCase()===name.toLowerCase())){toast('Name already exists');return}const entry={id:id===null?nextId(arr):id,name};if(type==='category')entry.description=String(f.get('description')||'');if(id===null)arr.push(entry);else Object.assign(arr.find(x=>x.id===id),entry);save();render();toast('Saved')}
function deleteCollection(type,id){const isClient=type==='client',arr=isClient?db.clients:db.categories,x=arr.find(x=>x.id===id);if(db.tasks.some(t=>t[isClient?'clientId':'categoryId']===id)){toast('Move linked tasks before deleting');return}if(x&&confirm(`Delete ${x.name}?`)){if(isClient)db.clients=arr.filter(x=>x.id!==id);else db.categories=arr.filter(x=>x.id!==id);save();render()}}
const SHEET_URL='https://docs.google.com/spreadsheets/d/1aalGgUY2bxfONNeKeaul8OT0L17VU86kgjX8N9T7FJ0/edit';
const BACKUP_SETTINGS_KEY='my_work_dashboard_sheet_backup_settings';
let backupSettings={};
try{backupSettings=JSON.parse(localStorage.getItem(BACKUP_SETTINGS_KEY)||'{}')}catch{}
function saveBackupSettings(){backupSettings.endpoint=($('backup-endpoint')?.value||'').trim();backupSettings.token=($('backup-token')?.value||'').trim();localStorage.setItem(BACKUP_SETTINGS_KEY,JSON.stringify(backupSettings));toast('Backup connection settings saved')}
async function sendSheetBackup(){
 const endpoint=($('backup-endpoint')?.value||backupSettings.endpoint||'').trim();
 const token=($('backup-token')?.value||backupSettings.token||'').trim();
 if(!(endpoint.startsWith('https://script.google.com/macros/s/') && endpoint.includes('/exec'))){toast('Enter your deployed Google Apps Script /exec URL');return}
 if(!token){toast('Enter your backup secret token');return}
 if(!confirm('Send a snapshot of all tasks, clients and categories to your Google Sheet?'))return;
 try{
  const payload={token,backupId:'work-'+Date.now(),data:db};
  await fetch(endpoint,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  toast('Backup request sent. Verify a new row in Google Sheet.');
 }catch(err){toast('Backup request failed: '+err.message)}
}
function backupView(){return `<div class="panel"><h2>Data Backup</h2><p class="muted">Export all tasks, clients and categories as JSON. Import a previous backup when switching browsers or devices.</p><div class="row"><button class="primary" onclick="exportData()">↓ Export JSON Backup</button><label style="margin:0"><input type="file" id="import-file" accept=".json,application/json" onchange="importData(event)" style="max-width:240px"></label></div><p class="muted small">Import replaces the current dashboard data. Keep a backup before importing.</p></div><div class="panel"><h3>Google Sheets Cloud Backup</h3><p class="muted small">Target: <a href="${SHEET_URL}" target="_blank" rel="noopener" style="color:#9db3ff">My Work Dashboard — Google Sheet</a>. Backups go to the "Dashboard Backups" tab. Setup requires deploying the companion Google Apps Script once.</p><label>Google Apps Script Web App URL (/exec)</label><input id="backup-endpoint" type="url" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(backupSettings.endpoint||'')}"><label style="margin-top:12px">Backup Secret Token</label><input id="backup-token" type="password" autocomplete="off" placeholder="Secret token configured in Apps Script" value="${esc(backupSettings.token||'')}"><div class="row" style="margin-top:14px"><button onclick="saveBackupSettings()">Save Connection</button><button class="primary" onclick="sendSheetBackup()">☁ Send Backup to Google Sheet</button></div><p class="muted small">Important: The browser cannot verify a no-cors Google Apps Script response. Confirm the new backup row appears in the sheet. Keep JSON backups too. Do not share your token or make the sheet public.</p></div>`}
function exportData(){const blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='my-work-dashboard-backup-'+TODAY()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function importData(e){const file=e.target.files?.[0];if(!file)return;try{const obj=JSON.parse(await file.text());if(!obj||!Array.isArray(obj.tasks)||!Array.isArray(obj.clients)||!Array.isArray(obj.categories))throw Error('Invalid backup structure');if(!confirm('Replace your CLOUD dashboard data with this imported backup? This will overwrite existing cloud records.'))return;db=obj;save();navigate('overview');toast('Cloud import queued; check sync status')}catch(err){toast('Invalid JSON backup')}}
// --- Supabase cloud authentication and per-user database sync ---
const CLOUD_CONFIG_KEY='my_work_dashboard_supabase_config';
let cloudConfig={};try{cloudConfig=JSON.parse(localStorage.getItem(CLOUD_CONFIG_KEY)||'{}')}catch{}
let cloudClient=null,cloudUser=null,cloudSaving=false,cloudError='',cloudQueue=Promise.resolve(),cloudVersion=0,cloudLoaded=false,cloudSnapshot={clients:[],categories:[],tasks:[]};
function cloudMessage(msg,isError=false){const el=$('cloud-message');if(el){el.textContent=msg;el.className=isError?'cloud-error':'muted small'}else toast(msg)}
function renderCloudGate(){
 $('cloud-indicator').textContent=cloudUser?'☁ Cloud connected':'Cloud login';$('nav').innerHTML='';
 const configured=!!(cloudConfig.url&&cloudConfig.key);
 $('content').innerHTML=`<section class="panel cloud-auth"><h2>☁ My Work Dashboard — Cloud Login</h2><p class="muted">Sign in with your Supabase email to use the same work data across devices.</p>
 ${!configured?`<div class="cloud-note">Set up your own Supabase project URL and <b>publishable</b> key. Never enter a secret/service_role key.</div><form onsubmit="configureCloud(event)"><label>Supabase Project URL</label><input name="url" type="url" placeholder="https://your-project.supabase.co" required><label style="margin-top:12px">Publishable key (sb_publishable_...)</label><input name="key" required autocomplete="off" placeholder="sb_publishable_..."><button class="primary" style="margin-top:15px">Save Cloud Settings</button></form>`:
 `<p class="muted small">Project: ${esc(cloudConfig.url)}</p><form onsubmit="cloudSignIn(event)"><label>Email</label><input name="email" type="email" autocomplete="email" required><label style="margin-top:12px">Password</label><input name="password" type="password" autocomplete="current-password" minlength="6" required><div class="cloud-actions" style="margin-top:15px"><button class="primary" type="submit">Sign In</button><button type="button" onclick="cloudSignUp()">Create Account</button><button type="button" onclick="cloudResetPassword()">Reset Password</button></div></form><button style="margin-top:15px" onclick="clearCloudConfig()">Change Supabase Settings</button>`}
 <p id="cloud-message" class="muted small" role="status" style="margin-top:16px"></p></section>`;
}
function configureCloud(e){e.preventDefault();const f=new FormData(e.target),url=String(f.get('url')||'').trim().replace(/\/+$/,''),key=String(f.get('key')||'').trim();if(!/^https:\/\/[a-z0-9-]+\.supabase\.co$/i.test(url)){cloudMessage('Enter the base URL ending in .supabase.co (without /rest/v1/).',true);return}if(!key.startsWith('sb_publishable_')&&!key.startsWith('eyJ')){cloudMessage('Only a publishable or legacy anon key is allowed. Never use sb_secret_.',true);return}cloudConfig={url,key};localStorage.setItem(CLOUD_CONFIG_KEY,JSON.stringify(cloudConfig));location.reload()}
function clearCloudConfig(){if(confirm('Change Supabase project settings? You will be signed out.')){localStorage.removeItem(CLOUD_CONFIG_KEY);location.reload()}}
async function loadSupabaseLibrary(){
 if(window.supabase?.createClient)return true;
 const urls=[
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js',
  'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
 ];
 for(const url of urls){
  try{
   await new Promise((resolve,reject)=>{
    const script=document.createElement('script');script.src=url;script.async=true;
    const timeout=setTimeout(()=>{script.remove();reject(new Error('Library download timed out'))},12000);
    script.onload=()=>{clearTimeout(timeout);resolve()};
    script.onerror=()=>{clearTimeout(timeout);script.remove();reject(new Error('Library CDN unavailable'))};
    document.head.appendChild(script);
   });
   if(window.supabase?.createClient)return true;
  }catch(err){console.warn('Supabase library load attempt failed:',err.message)}
 }
 return false;
}
async function initCloud(){
 if(!cloudConfig.url||!cloudConfig.key){renderCloudGate();return}
 renderCloudGate();cloudMessage('Loading Supabase library…');
 if(!(await loadSupabaseLibrary())){
  cloudMessage('Supabase library could not load. Check internet access or browser extensions, then reload. Use your Netlify HTTPS website rather than opening the HTML file directly.',true);
  return;
 }
 try{
  cloudClient=window.supabase.createClient(cloudConfig.url,cloudConfig.key,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  cloudClient.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){cloudUser=null;cloudLoaded=false;db={clients:[],categories:[],tasks:[]};renderCloudGate()}else if(session?.user&&(!cloudUser||cloudUser.id!==session.user.id)){cloudUser=session.user;setTimeout(()=>loadCloudData(),0)}});
  const {data,error}=await cloudClient.auth.getUser();
  if(error||!data?.user){renderCloudGate();cloudMessage('Ready. Sign in or create an account.');return}
  if(!cloudUser){cloudUser=data.user;loadCloudData()}
 }catch(err){renderCloudGate();cloudMessage('Cloud initialization failed: '+err.message,true)}
}
function requireCloudClient(){if(cloudClient?.auth)return true;cloudMessage('Cloud library is not ready. Reload the Netlify HTTPS page and try again.',true);return false}

async function cloudSignIn(e){e.preventDefault();if(!requireCloudClient())return;const f=new FormData(e.target);cloudMessage('Signing in…');try{const {error}=await cloudClient.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(error)cloudMessage(error.message,true)}catch(err){cloudMessage('Sign in failed: '+err.message,true)}}
async function cloudSignUp(){if(!requireCloudClient())return;const email=document.querySelector('[name="email"]')?.value.trim(),password=document.querySelector('[name="password"]')?.value;if(!email||!password){cloudMessage('Enter email and password first.',true);return}cloudMessage('Creating account…');try{const opts=location.protocol==='https:'?{emailRedirectTo:location.origin}:{};const {data,error}=await cloudClient.auth.signUp({email,password,options:opts});cloudMessage(error?error.message:data.session?'Account created. Loading…':'Check your email to confirm your account, then sign in.',!!error)}catch(err){cloudMessage('Account creation failed: '+err.message,true)}}
async function cloudResetPassword(){if(!requireCloudClient())return;const email=document.querySelector('[name="email"]')?.value.trim();if(!email){cloudMessage('Enter your email first.',true);return}try{const opts=location.protocol==='https:'?{redirectTo:location.origin}:{};const {error}=await cloudClient.auth.resetPasswordForEmail(email,opts);cloudMessage(error?error.message:'Password reset email requested. Check your inbox.',!!error)}catch(err){cloudMessage('Password reset failed: '+err.message,true)}}
async function cloudLogout(){if(!requireCloudClient())return;if(cloudSaving){toast('Wait for cloud sync to finish');return}await cloudClient.auth.signOut()}
function cloudToLocal(rows){return {clients:rows.clients.map(x=>({id:Number(x.id),name:x.name})),categories:rows.categories.map(x=>({id:Number(x.id),name:x.name,description:x.description||''})),tasks:rows.tasks.map(x=>({id:Number(x.id),name:x.name,clientId:Number(x.client_id),categoryId:Number(x.category_id),status:x.status,priority:x.priority,date:x.date,minutes:x.minutes,remarks:x.remarks||''}))}}
function cloudToRows(data){return {clients:data.clients.map(x=>({user_id:cloudUser.id,id:x.id,name:x.name})),categories:data.categories.map(x=>({user_id:cloudUser.id,id:x.id,name:x.name,description:x.description||''})),tasks:data.tasks.map(x=>({user_id:cloudUser.id,id:x.id,name:x.name,client_id:x.clientId,category_id:x.categoryId,status:x.status,priority:x.priority,date:x.date,minutes:x.minutes,remarks:x.remarks||''}))}}
async function loadCloudData(){if(!cloudUser||!cloudClient)return;cloudLoaded=false;$('nav').innerHTML='';$('content').innerHTML='<div class="panel">Loading cloud work data…</div>';
 try{const results=await Promise.all(['clients','categories','tasks'].map(t=>cloudClient.from(t).select('*').order('id')));for(const r of results)if(r.error)throw r.error;
 const rows={clients:results[0].data,categories:results[1].data,tasks:results[2].data};cloudSnapshot=structuredClone(rows);db=cloudToLocal(rows);cloudLoaded=true;cloudError='';render();showCloudBanner()}
 catch(err){cloudError=err.message;$('content').innerHTML=`<div class="panel"><h2>Cloud load failed</h2><p class="cloud-error">${esc(err.message)}</p><button onclick="loadCloudData()">Retry</button><button onclick="cloudLogout()">Sign Out</button></div>`;toast('Cloud load failed')}}
function showCloudBanner(){if(!cloudLoaded)return;const el=document.createElement('div');el.className='panel';el.id='cloud-banner';el.innerHTML=`<div class="row between"><div><b>☁ Cloud Connected</b><div class="muted small">${esc(cloudUser.email||'Signed in')} · Sync changes across devices</div></div><div class="cloud-actions"><button onclick="loadCloudData()">↻ Refresh Cloud</button><button onclick="cloudImportLocal()">Import Old Local Data</button><button onclick="cloudLogout()">Sign Out</button></div></div><div id="cloud-sync-state" class="cloud-status">${cloudError?'⚠ '+esc(cloudError):cloudSaving?'Saving changes…':'All data loaded from Supabase'}</div>`;$('content').prepend(el)}
const baseRender=render;render=function(){baseRender();if(cloudLoaded&&cloudUser)showCloudBanner()};
function cloudSyncStatus(){const el=$('cloud-sync-state');if(el)el.textContent=cloudError?'⚠ Sync error: '+cloudError:cloudSaving?'Saving changes…':'✓ Cloud saved';$('cloud-indicator').textContent=cloudError?'⚠ Sync error':cloudSaving?'☁ Syncing…':'☁ Cloud connected'}
function queueCloudSave(){if(!cloudLoaded||!cloudUser){toast('Cloud data is not ready');return}const version=++cloudVersion;const data=structuredClone(db);cloudSaving=true;cloudError='';cloudSyncStatus();cloudQueue=cloudQueue.catch(()=>{}).then(async()=>{if(!cloudUser)throw Error('Signed out');const rows=cloudToRows(data);
 // Upsert parents first, then tasks. Delete removed tasks first, then parents.
 for(const table of ['clients','categories','tasks']){if(rows[table].length){const {error}=await cloudClient.from(table).upsert(rows[table],{onConflict:'user_id,id'});if(error)throw error}}
 for(const table of ['tasks','categories','clients']){const wanted=new Set(rows[table].map(x=>Number(x.id)));const removed=cloudSnapshot[table].filter(x=>!wanted.has(Number(x.id))).map(x=>x.id);if(removed.length){const {error}=await cloudClient.from(table).delete().in('id',removed);if(error)throw error}}
 cloudSnapshot=structuredClone(rows);if(version===cloudVersion){cloudSaving=false;cloudError='';cloudSyncStatus()}
 }).catch(err=>{cloudSaving=false;cloudError=err.message||String(err);cloudSyncStatus();toast('Cloud sync failed — check error and refresh after resolving')});}
async function cloudImportLocal(){if(!cloudLoaded)return;let raw=localStorage.getItem(KEY);if(!raw){toast('No old local data found in this browser');return}let old;try{old=JSON.parse(raw);if(!Array.isArray(old.clients)||!Array.isArray(old.categories)||!Array.isArray(old.tasks))throw Error('Invalid format')}catch{toast('Old local data is invalid');return}
 if(!confirm(`Import ${old.tasks.length} local task(s) into your cloud dashboard? This will REPLACE your current cloud data (${db.tasks.length} tasks). Export a cloud JSON backup first.`))return;
 if(!confirm('Final confirmation: replace existing cloud clients, categories and tasks with the old local data?'))return;
 db=old;queueCloudSave();render();toast('Import queued. Wait for ✓ Cloud saved before refreshing')}
initCloud();
</script></body></html>
